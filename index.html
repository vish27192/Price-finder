*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--head);color:var(--headink)}
.bar{display:flex;align-items:center;gap:10px;padding:8px 12px 0}
.bar h1{font-size:16px;margin:0;font-weight:800;letter-spacing:.2px;flex:1}
.bar small{font-weight:500;opacity:.7;font-size:12px;display:block;margin-top:1px}
.pill{font-size:12px;padding:3px 8px;border-radius:10px;background:var(--y);color:var(--yink);font-weight:700;display:none}

.sw{position:relative;padding:8px 12px}
#q{width:100%;font-size:20px;padding:12px 44px 12px 14px;border:3px solid transparent;border-radius:12px;background:#fff;color:#14171a;outline:none}
#q::-webkit-search-cancel-button{display:none}
#q:focus{border-color:var(--y)}
#x{position:absolute;right:18px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:50%;background:#dcdfe4;color:#14171a;font-size:20px;display:none}
.set{display:none;padding:0 12px 8px;gap:14px;align-items:center;font-size:13px}
.set.on{display:flex}
.set input{width:62px;font-size:16px;padding:6px;border-radius:8px;border:0;margin-left:6px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 12px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid #ffffff33;background:transparent;color:#fff;border-radius:18px;padding:7px 12px;font-size:14px;font-weight:600}
.chip i{font-style:normal;opacity:.65;font-weight:500;margin-left:5px}
.chip.on{background:var(--y);border-color:var(--y);color:var(--yink)}
.chip.z{opacity:.35}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px 14px;background:#2a2e34;font-size:11.5px;font-weight:700;text-align:right;color:#e8eaed}
.cols span:last-child{color:var(--y)}
main{max-width:980px;margin:0 auto;padding:4px 8px 60px}
.g{font-size:13px;font-weight:800;padding:14px 6px 4px;color:var(--ink)}
.r{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-top:6px}
.n{font-weight:650;font-size:15px;overflow-wrap:anywhere}
.m{font-size:12.5px;color:var(--mute);margin:2px 0 6px}
.m b{color:var(--ink);font-weight:700;user-select:all}
.ph{color:var(--warn);font-weight:700}
.f{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:right;font-variant-numeric:tabular-nums;font-size:13.5px}
.f span:nth-child(3){color:var(--mute)}
.f .t{font-weight:800;font-size:15px;background:var(--y);color:var(--yink);border-radius:6px;padding:1px 5px;margin:-1px 0}
.e,.more{display:block;margin:24px auto;text-align:center;color:var(--mute);font-size:16px}
.more{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px 22px;border-radius:10px;font-size:15px}
.foot{font-size:12px;color:var(--mute);text-align:center;padding:10px 12px}
@media (min-width:760px){
 .cols,.r{grid-template-columns:1fr 420px}
 .cols{display:grid;grid-template-columns:1fr 420px;padding:6px 20px}
 .cols .l{text-align:left}
 .cols .c4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
 .r{display:grid;align-items:center;gap:12px}
 .m{margin:2px 0 0}

.cols .c4{display:contents}
@media (min-width:760px){.cols .c4{display:grid}}
.cols .l{display:none}
@media (min-width:760px){.cols .l{display:block}}

var TABS=DATA.tabs,IT=DATA.items,tab=-1,lim=250,disc=10,gst=18;
var $=function(i){return document.getElementById(i)};
function norm(s){return s.toLowerCase().replace(/[^a-z0-9.\s]/g," ")}
function comp(s){return s.toLowerCase().replace(/[^a-z0-9]/g,"")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
IT.forEach(function(r,i){
  var sub=r[1].toUpperCase(),d=r[3].toUpperCase();
  r.name=(d.indexOf(sub)>-1||sub.indexOf(d)>-1)?r[3]:(r[1]+" \u2013 "+r[3]);
  var t=TABS[r[0]]+" "+r[2]+" "+r.name;r.h=t.toLowerCase().replace(/[\u201c\u201d]/g,'"');r.c=comp(t);r.p=comp(r[2]);r.i=i;
});
try{var s=JSON.parse(localStorage.getItem("pf")||"{}");if(s.d!=null)disc=s.d;if(s.g!=null)gst=s.g}catch(e){}
function money(p){return (p/100).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}
function calc(price){var P=Math.round(price*100),D=Math.round(P*(100-disc)/100),G=Math.round(D*gst/100);return[P,D,G,D+G]}
function match(q){
  var toks=q.toLowerCase().replace(/[\u201c\u201d]/g,'"').split(/\s+/).filter(Boolean);
  if(!toks.length)return IT.slice();
  var qc=comp(q),out=IT.filter(function(r){return toks.every(function(t){return r.h.indexOf(t)>-1||(/^[a-z0-9.\-]+$/.test(t)&&r.c.indexOf(comp(t))>-1)})});
  out.forEach(function(r){r.k=r.p.indexOf(qc)===0?0:(r.p.indexOf(qc)>-1?1:(comp(r.name).indexOf(qc)===0?2:3))});
  return out.sort(function(a,b){return a.k-b.k||a.i-b.i});
}
function render(){
  var q=$("q").value;$("x").style.display=q?"block":"none";
  $("h2").textContent="After "+disc+"% off";$("h3").textContent="GST "+gst+"%";
  var all=match(q),cnt=TABS.map(function(){return 0});all.forEach(function(r){cnt[r[0]]++});
  $("chips").innerHTML=['<button class="chip'+(tab<0?" on":"")+'" data-t="-1">All<i>'+all.length+'</i></button>'].concat(TABS.map(function(n,i){return '<button class="chip'+(tab===i?" on":"")+(cnt[i]?"":" z")+'" data-t="'+i+'">'+esc(n)+'<i>'+cnt[i]+'</i></button>'})).join("");
  var rows=tab<0?all:all.filter(function(r){return r[0]===tab});
  if(!rows.length){$("list").innerHTML='<div class="e">No match. Try fewer letters or just the part number.</div>';return}
  var h="",last="",flat=!!q.trim(),shown=rows.slice(0,lim);
  shown.forEach(function(r){
    if(!flat){var g=TABS[r[0]]+"|"+r[1];if(g!==last){last=g;h+='<div class="g">'+(tab<0?esc(TABS[r[0]])+" \u203A ":"")+esc(r[1])+'</div>'}}
    var c=calc(r[5]);
    h+='<div class="r"><div><div class="n">'+esc(r.name)+'</div><div class="m"><b>'+esc(r[2]||"\u2014")+'</b>'+(r[4]?" \u00B7 MOQ "+esc(r[4]):"")+((flat||tab<0)&&flat?" \u00B7 "+esc(TABS[r[0]]):"")+(r[6]?' \u00B7 <span class="ph">\u2193 Phased out</span>':"")+'</div></div><div class="f"><span>'+money(c[0])+'</span><span>'+money(c[1])+'</span><span>'+money(c[2])+'</span><span class="t">'+money(c[3])+'</span></div></div>';
  });
  if(rows.length>lim)h+='<button class="more" id="more">Show more ('+(rows.length-lim)+' left)</button>';
  $("list").innerHTML=h;
}
var tm;$("q").addEventListener("input",function(){lim=250;clearTimeout(tm);tm=setTimeout(render,60)});
$("x").addEventListener("click",function(){$("q").value="";lim=250;render();$("q").focus()});

$("list").addEventListener("click",function(e){if(e.target.id==="more"){lim+=400;render()}});

$("dsc").value=disc;$("gst").value=gst;
